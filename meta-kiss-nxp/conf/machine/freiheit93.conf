require conf/machine/include/common.inc
require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

MACHINE_FEATURES = "usbhost usbgadget alsa serial wifi bluetooth"

# On-board combo chip is the NXP IW612 (SDIO vendor 0x0471, device 0x0205 /
# btnxpuart ChipID 0x7601 "IW612" - confirmed on hardware; NOT a Marvell
# 88W8987 despite the upstream DTS bluetooth node compatible string). Mainline
# mwifiex has no IW612/SD9177 ID table entry, so WLAN needs NXP's downstream
# driver (kernel-module-nxp-wlan, moal/mlan). Bluetooth works with the
# in-tree btnxpuart driver - it already detects the chip correctly and only
# needs firmware. Both firmware/driver recipes come from meta-freescale
# (already in bblayers) and have no COMPATIBLE_MACHINE restriction.

SERIAL_CONSOLES = "115200;ttyLP0"
# uboot-extlinux-config.bbclass defaults UBOOT_EXTLINUX_CONSOLE to
# "console=${console},${baudrate}", but this board's mainline U-Boot env
# (board/nxp/imx93_frdm/imx93_frdm.env) already defines "console" as the
# combined "ttyLP0,115200" string, so the substitution produced the
# malformed "console=ttyLP0,115200,115200" and no serial console output.
UBOOT_EXTLINUX_CONSOLE = "console=ttyLP0,115200"

PREFERRED_PROVIDER_virtual/kernel = "linux-kiss"
KERNEL_DEVICETREE = "freescale/imx93-11x11-frdm.dtb"
KERNEL_IMAGETYPE = "Image"

TFA_PLATFORM = "imx93"
TFA_BUILD_TARGET = "bl31"
TFA_SPD = "opteed"

SECO_FIRMWARE_NAME = "mx93a1-ahab-container.img"

OPTEEMACHINE = "imx"
COMPATIBLE_MACHINE:pn-optee-examples = "^freiheit93$"

IMX_BOOT_SEEK = "32"

PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot-kiss"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = "u-boot-kiss-extlinux kernel-devicetree"
UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "imx93_frdm_defconfig"
UBOOT_CONFIG_IMAGE_FSTYPES[sd] = "sdcard"
DDR_FIRMWARE_NAME = " \
    lpddr4_dmem_1d_v202201.bin \
    lpddr4_dmem_2d_v202201.bin \
    lpddr4_imem_1d_v202201.bin \
    lpddr4_imem_2d_v202201.bin \
"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += " \
    kernel-module-adp5585 \
    kernel-module-dwmac-imx \
    kernel-module-flexcan \
    kernel-module-imx7ulp-wdt \
    kernel-module-imx93-adc \
    kernel-module-nvmem-imx-ocotp-ele \
    kernel-module-nxp-bbnsm-pwrkey \
    kernel-module-qoriq-thermal \
    kernel-module-reset-gpio \
    kernel-module-rtc-nxp-bbnsm \
    kernel-module-rtc-pcf2127 \
    kernel-module-snd-soc-fsl-asoc-card \
    kernel-module-snd-soc-fsl-mqs \
    kernel-module-snd-soc-fsl-sai \
    kernel-module-spidev \
    kernel-module-tcpci \
"

MACHINE_EXTRA_RRECOMMENDS += " \
    kernel-module-nxp-wlan \
    firmware-nxp-wifi-nxpiw612-sdio \
    imx-m33-demos \
"

IMAGE_BOOT_FILES ?= " \
    ${KERNEL_IMAGETYPE} \
    ${@os.path.basename(d.getVar("KERNEL_DEVICETREE"))} \
"
